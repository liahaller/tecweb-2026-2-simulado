<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Get-it</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
            integrity="sha512-NmLkDIU1C/C88wi324HBc+S2kLhi08PN5GDeUVVVC/BVt/9Izdsc9SVeVfA1UZbY3sHUlDSyRXhCzHfr6hmPPw=="
            crossorigin="anonymous"
        />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/getit.css" />
    </head>

    <body>
        <div class="appbar">
            <img src="/img/logo-getit.png" class="logo" />
            <span class="subtitle">Como o Post-it, mas com outro verbo</span>
        </div>

        <main class="container">
            <div class="erro-404">
                <svg class="ilustracao-404" viewBox="0 0 240 210" role="img" aria-label="Post-it perdido">
                    <g transform="rotate(-6 120 105)">
                        <rect x="55" y="35" width="130" height="130" fill="#f7d736" />
                        <polygon points="55,165 185,165 185,148 55,156" fill="#e0af26" opacity="0.4" />
                        <circle cx="98" cy="85" r="7" fill="#2c2c2c" />
                        <circle cx="142" cy="85" r="7" fill="#2c2c2c" />
                        <path d="M 96 128 Q 120 106 144 128" stroke="#2c2c2c" stroke-width="7"
                              fill="none" stroke-linecap="round" />
                    </g>
                </svg>
                <h1 class="titulo-404">404</h1>
                <p class="mensagem-404">
                    Essa anotação a gente não achou. Deve ter caído atrás da geladeira.
                </p>
                <a class="btn" href="/">Voltar para as anotações</a>
            </div>
        </main>

        <script type="text/javascript" src="/getit.js"></script>
    </body>
</html>
